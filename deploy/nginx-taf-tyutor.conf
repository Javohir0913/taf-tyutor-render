# /etc/nginx/sites-available/taf-tyutor
# DOMEN_NOMI ni o'z domeningizga almashtiring (domen yo'q bo'lsa: server IP manzili).
# HTTPS (443) qismini certbot o'zi qo'shadi.

server {
    listen 80;
    server_name DOMEN_NOMI;

    # Pasport 5 MB + forma
    client_max_body_size 6M;

    access_log /var/log/nginx/taf-tyutor.access.log;
    error_log  /var/log/nginx/taf-tyutor.error.log;

    # Admin va forma uslublari
    location /static/ {
        alias /srv/taf-tyutor/staticfiles/;
        expires 7d;
        access_log off;
    }

    # DIQQAT: private_media/ uchun HECH QANDAY location qo'shmang.
    # Pasportlar faqat Django orqali, admin login bilan ochiladi.

    location / {
        proxy_pass http://unix:/run/taf-tyutor/gunicorn.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
